# Main configuration. Every value can be overridden by an environment variable using
# Spring's relaxed binding, e.g. spring.datasource.url  ->  SPRING_DATASOURCE_URL.
spring:
  application:
    name: payments-ledger

  datasource:
    url: jdbc:postgresql://localhost:5432/ledger
    username: ledger
    password: ledger
    hikari:
      # Max DB connections. Each in-flight transfer holds one connection for the whole
      # transaction, so this caps how many transfers run truly in parallel.
      maximum-pool-size: 20

  jpa:
    # Open-Session-In-View keeps a DB connection open for the whole HTTP request, including
    # JSON rendering. We turn it off so a connection is only held inside @Transactional code.
    open-in-view: false
    hibernate:
      # Flyway creates the schema. Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Flush UPDATEs sorted by entity type and primary key. Two transactions that update
        # the same accounts then always lock rows in the same order, which avoids deadlocks.
        order_updates: true

  kafka:
    # Overridden in Docker Compose (kafka:9092). Unused in the "core" profile.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Wait for all in-sync replicas; the idempotent producer prevents duplicates from
      # the producer's own internal retries.
      acks: all
      properties:
        enable.idempotence: true
        # Fail fast when Kafka is down instead of blocking the publisher for a minute.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: ledger-notifications
      auto-offset-reset: earliest
    listener:
      # Commit each record's offset right after it was processed successfully.
      ack-mode: record

  jackson:
    deserialization:
      # By default Jackson silently turns 10.5 into 10 for a long field. For money that is
      # a bug, so a fractional amount must be rejected with 400 instead.
      accept-float-as-int: false

  mvc:
    problemdetails:
      # Spring's own errors (bad JSON, missing header, wrong method...) are rendered as
      # RFC 7807 application/problem+json, same as our custom errors.
      enabled: true

ledger:
  # Concurrency-control strategy for transfers and deposits: naive | pessimistic | optimistic.
  # naive is deliberately broken (lost updates) and exists only for demos and load tests.
  locking: pessimistic
  optimistic:
    # Total attempts of the whole transaction on version conflicts, with "full jitter"
    # exponential backoff between attempts: random(0, min(max-backoff, base-backoff * 2^n)).
    max-attempts: 10
    base-backoff: 5ms
    max-backoff: 100ms

  security:
    # HMAC-SHA256 key for signing JWTs, at least 32 bytes. The default is for local
    # development only; production MUST set the JWT_SECRET environment variable.
    jwt-secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef}
    token-ttl: 1h
    issuer: payments-ledger
    bcrypt-strength: 10
    # First ADMIN user, created at startup if both are set (ADMIN_EMAIL / ADMIN_PASSWORD).
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}

  kafka:
    # false in the "core" profile (application-core.yml): no publisher, no consumer.
    enabled: true
    topic: ledger.transfer-completed
    publish-interval: PT0.5S
    publish-batch-size: 100
    send-timeout: 5s

  reconciliation:
    # Scheduled check of invariants 1-4 across all accounts (ReconciliationJob).
    enabled: true
    interval: PT5M
    initial-delay: PT30S

management:
  endpoints:
    web:
      exposure:
        # /actuator/health and /info are public; metrics and prometheus need ADMIN (SecurityConfig).
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
      probes:
        # /actuator/health/liveness and /readiness for container orchestrators.
        enabled: true

logging:
  pattern:
    # Prints the request id (set by RequestIdFilter in the MDC) on every log line.
    correlation: "[%X{requestId:-}] "

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  shutdown: graceful
