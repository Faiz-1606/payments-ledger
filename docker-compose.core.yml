# App + PostgreSQL, no Kafka (the "core" profile).
#
#   docker compose -f docker-compose.core.yml up --build
#   open http://localhost:8080/swagger-ui.html
#
# Host ports are configurable in case 8080/5432 are taken on your machine:
#   LEDGER_HTTP_PORT=18080 LEDGER_DB_PORT=15432 docker compose -f docker-compose.core.yml up --build
name: payments-ledger-core

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      - "${LEDGER_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    image: payments-ledger:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-core}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledger
      SPRING_DATASOURCE_USERNAME: ledger
      SPRING_DATASOURCE_PASSWORD: ledger
      # Local-only values. Real deployments inject secrets from their platform (docs/DEPLOY.md).
      JWT_SECRET: local-compose-secret-not-for-production-0123456789
      ADMIN_EMAIL: admin@ledger.local
      ADMIN_PASSWORD: admin-password-local
      LEDGER_LOCKING: ${LEDGER_LOCKING:-pessimistic}
    ports:
      - "${LEDGER_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

volumes:
  pgdata:
